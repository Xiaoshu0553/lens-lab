services:
  showcase:
    build:
      context: .
      network: host
    image: lens-lab-showcase:20261020
    environment:
      STUDY_MODE: demo
      SHOWCASE_MODE: "1"
      DATABASE_PATH: /app/showcase-data/showcase.sqlite3
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ASSIGNMENT_SEED: ${ASSIGNMENT_SEED:-lens-showcase-seed}
      MODEL_API_KEY: ""
      MODEL_BASE_URL: http://localhost
      MODEL_NAME: DEMO-RULE
      MODEL_TEMPERATURE: "0"
      MODEL_THINKING: disabled
      MODEL_MAX_TOKENS: "800"
      MAX_TURNS: "12"
      MAX_MINUTES: "30"
      LITERACY_BAND_WIDTH: "10"
      CLARIFICATION_STRATEGY: module
    volumes:
      - ./showcase-data:/app/showcase-data
      - ./synthetic-datasets:/app/synthetic-datasets:ro
    ports:
      - "127.0.0.1:8001:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/info', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
